<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../public/metronic/css/style.bundle.css">
<link rel="stylesheet" href="../../public/css/app.css">
<title>DataTables escaping regression checks</title>
<link rel="stylesheet" href="../../public/metronic/plugins/custom/datatables/datatables.bundle.css">
<body>
<h1>DataTables escaping regression checks</h1>
<p>Serve this fixture from the repository root using a static test server. It uses no application or database.</p>
<pre id="results">Running…</pre>
<div id="tables"></div>
<script src="../../public/metronic/plugins/global/plugins.bundle.js"></script>
<script src="../../public/metronic/plugins/custom/datatables/datatables.bundle.js"></script>
<script type="module">
import { initDataTable, refreshDataTable } from '../../public/js/datatable.js';

const results = [];
const check = (name, condition) => {
    results.push({ name, passed: Boolean(condition) });
    if (!condition) throw new Error(name);
};
const callbacks = {};
window.Livewire = { on: (name, callback) => { callbacks[name] = callback; } };
window.cardLoaderCalls = 0;
window.triggerLoading = () => { window.cardLoaderCalls++; };
window.tableScriptExecuted = false;
const payload = '<img src=x onerror="window.tableScriptExecuted=true">';
const columns = [{ data: 'name' }, { data: 'amount' }, { data: 'empty' }, { data: 'status' }, { data: 'show_route' }];
const rows = [
    { name: payload, amount: 20, empty: null, status: { label: '<svg onload="window.tableScriptExecuted=true">', badgeColor: 'success" onclick="window.tableScriptExecuted=true' }, show_route: '/application/one?name=" onmouseover="bad' },
    { name: `O'Neil & "Family" <literal>`, amount: 3, empty: '', status: 'Draft', show_route: `${location.origin}.evil.test/application` },
    { name: 'Alpha', amount: 10, empty: null, status: { label: 'approved', badgeColor: 'success' }, show_route: `${location.origin}/application/two` },
];
function table(id, data = rows, ajax = false) {
    const element = document.createElement('table');
    element.id = `dataTable-${id}`;
    element.className = 'data-table with-status with-actions';
    element.style.width = '100%';
    element.innerHTML = '<thead><tr><th>Name</th><th>Amount</th><th>Empty</th><th>Status</th><th></th></tr></thead><tbody></tbody>';
    document.getElementById('tables').append(element);
    $(element).data({ columns, rows: data, route: ajax ? '/fixture-rows' : '#', src: ajax ? 'data' : null, 'count-per-page': 2 });
    return $(element);
}
function hasNoInjectedElements(element) {
    return !element.querySelector('img, svg, script, [onerror], [onload], [onclick], [onmouseover]');
}

try {
    const element = table('initial');
    initDataTable(element);
    const api = element.DataTable();
    check('Initial HTML-like data is literal text', api.cell(0, 0).node().textContent === payload && hasNoInjectedElements(element[0]));
    check('Quotes and ampersands remain readable', api.cell(1, 0).node().textContent === rows[1].name);
    check('Numbers and empty values render correctly', api.cell(0, 1).node().textContent === '20' && api.cell(0, 2).node().textContent === '');
    check('Status labels cannot insert HTML or attributes', api.cell(0, 3).node().querySelector('span').className === 'badge badge-primary' && hasNoInjectedElements(api.cell(0, 3).node()));
    check('String statuses stay readable', api.cell(1, 3).node().textContent === 'DRAFT');
    check('Valid status colors survive', api.cell(2, 3).node().querySelector('.badge-success') !== null);
    const link = api.cell(0, 4).node().querySelector('a');
    check('Same-origin links use safe attributes', link?.origin === location.origin && !link.hasAttribute('onmouseover'));
    check('Origin-prefix spoofing is rejected', api.cell(1, 4).node().querySelector('a') === null);
    for (const value of ['javascript:alert(1)', 'data:text/html,bad', '//evil.test/path', '/\\evil.test/path', `${location.origin}@evil.test/path`, `${location.origin}/`.replace('http:', 'https:'), '', '#', null, 12]) {
        const renderer = api.settings()[0].aoColumns[4].mRender;
        check(`Reject unsafe action URL: ${String(value)}`, renderer(value, 'display') === '');
    }
    api.search('onerror').draw();
    check('Search matches literal HTML-like content', api.rows({ search: 'applied' }).count() === 1);
    api.search('').order([1, 'asc']).draw();
    check('Numeric sorting uses raw values', api.rows({ order: 'applied' }).data().toArray().map(row => row.amount).join(',') === '3,10,20');
    api.page(1).draw(false);
    check('Pagination remains functional', api.page.info().page === 1);
    const exported = api.buttons.exportData({ modifier: { order: 'index' } }).body;
    check('Excel export retains readable text', exported.some(row => row[0] === rows[1].name) && exported.some(row => row[0] === payload));
    // Exercise the responsive extension's actual hidden-column renderer.
    const detail = $.fn.dataTable.Responsive.defaults.details.renderer(api, 0, [{ hidden: true, columnIndex: 0, rowIndex: 0, title: 'Name', data: api.cell(0, 0).render('display'), className: '' }]);
    check('Responsive details keep values escaped', detail[0].textContent.includes(payload) && hasNoInjectedElements(detail[0]));
    initDataTable(element);
    check('Repeated initialization is harmless', element.DataTable().settings().length === 1);
    refreshDataTable();
    callbacks['refresh-dataTable']([{ dataTableId: 'initial', rows }]);
    check('Livewire refresh preserves state and escaping', api.page.info().page === 1 && api.order()[0][0] === 1 && api.cell(0, 0).node().textContent === payload && hasNoInjectedElements(element[0]));
    const deferred = table('deferred', []);
    callbacks['refresh-dataTable']([{ dataTableId: 'deferred', rows }]);
    check('Refresh initializes a previously uninitialized table', deferred.DataTable().rows().count() === rows.length && hasNoInjectedElements(deferred[0]));
    callbacks['refresh-dataTable']([{ dataTableId: 'missing', rows }]);
    check('Refresh of a removed table is harmless', true);
    const ajaxElement = table('ajax', [], true);
    const loaded = new Promise(resolve => ajaxElement.one('init.dt', resolve));
    $.ajaxTransport('+*', options => options.url.startsWith('/fixture-rows') ? {
        send: (_, complete) => complete(200, 'OK', { text: JSON.stringify({ data: rows }) }, 'Content-Type: application/json'), abort: () => {},
    } : undefined);
    initDataTable(ajaxElement);
    await loaded;
    check('AJAX-loaded values use the same escaping', ajaxElement.DataTable().cell(0, 0).node().textContent === payload && hasNoInjectedElements(ajaxElement[0]));
    await new Promise(resolve => setTimeout(resolve, 50));

    // Responsive cards use exactly the same engine and raw rows as desktop.
    const root = document.createElement('section');
    root.className = 'record-data-table'; root.dataset.responsiveDataTable = '';
    root.dataset.cardFields = JSON.stringify({ primary: 'name', secondary: 'amount', tertiary: 'empty', badge: 'status' });
    root.innerHTML = '<div data-table-toolbar></div><div class="record-data-table-desktop"></div><div class="record-data-table-cards" data-table-cards></div><div data-table-footer></div>';
    document.getElementById('tables').append(root);
    const responsiveTable = table('cards');
    root.querySelector('.record-data-table-desktop').append(responsiveTable[0]);
    initDataTable(responsiveTable);
    const responsiveApi = responsiveTable.DataTable();
    const cardNodes = () => [...root.querySelectorAll('.record-data-card')];
    check('Cards use current DataTables page', cardNodes().length === 2);
    check('Unsafe destination produces a noninteractive card', cardNodes()[1].tagName === 'ARTICLE');
    check('Card values remain escaped', hasNoInjectedElements(root) && root.textContent.includes(payload));
    check('Whole card is the record link', cardNodes()[0].tagName === 'A' && !cardNodes()[0].querySelector('a,button'));
    const desktopVisible = getComputedStyle(root.querySelector('.record-data-table-desktop')).display !== 'none';
    check('Breakpoint uses desktop table at lg', desktopVisible === matchMedia('(min-width:992px)').matches);
    if (!desktopVisible) {
        const grid = getComputedStyle(root.querySelector('[data-table-cards]')).gridTemplateColumns.split(' ').length;
        check('Card grid follows md breakpoint', grid === (matchMedia('(min-width:768px)').matches ? 2 : 1));
    }
    responsiveApi.order([1, 'asc']).draw();
    check('Cards follow numeric sorting', cardNodes()[0].textContent.includes('3'));
    const sortControl = root.querySelector('.record-data-table-sort select');
    sortControl.value = '1:desc'; sortControl.dispatchEvent(new Event('change'));
    check('Mobile sort control updates engine', responsiveApi.order()[0][1] === 'desc');
    const searchControl = root.querySelector('input[type=search]');
    searchControl.value = 'Alpha'; searchControl.dispatchEvent(new Event('input'));
    await new Promise(resolve => setTimeout(resolve, 250));
    check('Shared search filters cards', cardNodes().length === 1 && cardNodes()[0].textContent.includes('Alpha'));
    responsiveApi.search('missing').draw();
    check('Filtered empty state is distinct', root.querySelector('[data-table-cards]').textContent.includes('No matching records'));
    responsiveApi.search('').order([1, 'asc']).draw();
    const perPage = root.querySelectorAll('[data-table-toolbar] select')[1];
    perPage.value = '5'; perPage.dispatchEvent(new Event('change'));
    check('Page size changes both presentations', responsiveApi.page.len() === 5 && cardNodes().length === 3);
    responsiveApi.page.len(2).page(1).draw(false);
    callbacks['refresh-data-table']([{ dataTableId: 'cards', rows }]);
    check('Canonical refresh preserves page sort and length', responsiveApi.page() === 1 && responsiveApi.page.len() === 2 && responsiveApi.order()[0][0] === 1);
    callbacks['refresh-dataTable']([{ dataTableId: 'cards', rows: [rows[2]] }]);
    check('Refresh clamps disappeared last page', responsiveApi.page() === 0 && cardNodes().length === 1);
    callbacks['refresh-data-table']([{ dataTableId: 'cards', rows: [] }]);
    check('Empty parent refresh clears cards', cardNodes().length === 0 && root.querySelector('[data-table-cards]').textContent.includes('No records'));
    callbacks['refresh-data-table']([{ dataTableId: 'cards', rows }]);
    const exportRows = responsiveApi.buttons.exportData({ columns: [0,1,2,3], modifier: { search: 'applied', order: 'applied', page: 'all' } });
    check('Export spans pages and excludes destination', exportRows.body.length === 3 && exportRows.body.every(row => row.length === 4));
    initDataTable(responsiveTable);
    searchControl.focus();
    responsiveApi.draw(false);
    check('Parent redraw preserves search focus', document.activeElement === searchControl);
    const focusableCard = root.querySelector('a.record-data-card');
    if (!desktopVisible) focusableCard.focus();
    check('Card badges preserve uppercase display', [...root.querySelectorAll('.record-data-card .badge')].every(badge => badge.textContent === badge.textContent.toUpperCase()));
    check('Record card is keyboard focusable', focusableCard.tabIndex === 0 && (desktopVisible || document.activeElement === focusableCard));
    check('Responsive initialization stays idempotent', root.querySelectorAll('input[type=search]').length === 1);
    if (innerWidth < 768) {
        const searchBox = root.querySelector('.record-data-table-search').getBoundingClientRect();
        const sortBox = root.querySelector('.record-data-table-sort').getBoundingClientRect();
        const lengthBox = root.querySelector('.record-data-table-length').getBoundingClientRect();
        const toolbarBox = root.querySelector('[data-table-toolbar]').getBoundingClientRect();
        check('Phone search fills its own row', Math.abs(searchBox.width - toolbarBox.width) < 2 && searchBox.bottom < sortBox.top);
        check('Phone sort and per-page share a row', Math.abs(sortBox.top - lengthBox.top) < 2);
        const footerBox = root.querySelector('[data-table-footer]').getBoundingClientRect();
        check('Phone footer controls fill the width', ['.record-data-table-actions', '.record-data-table-info', '.record-data-table-pagination'].every(selector => Math.abs(root.querySelector(selector).getBoundingClientRect().width - footerBox.width) < 2));
        check('Phone record count and pagination are centered', getComputedStyle(root.querySelector('.record-data-table-info')).textAlign === 'center' && getComputedStyle(root.querySelector('nav')).justifyContent === 'center');
    }
    const loaderCalls = window.cardLoaderCalls;
    focusableCard.href = location.href.split('#')[0] + '#card-loader-check';
    focusableCard.click();
    check('Card click invokes existing loader', window.cardLoaderCalls === loaderCalls + 1);
    await new Promise(resolve => setTimeout(resolve, 350));
    check('Card navigation follows loader', location.hash === '#card-loader-check');
    document.documentElement.setAttribute('data-bs-theme', 'dark');
    check('Dark mode cards retain themed background', getComputedStyle(cardNodes()[0]).backgroundColor !== 'rgba(0, 0, 0, 0)');
    document.documentElement.setAttribute('data-bs-theme', 'light');
    const summaryRoot = root.cloneNode(false);
    summaryRoot.dataset.cardFields = JSON.stringify({ primary: 'name', secondary: 'amount', labels: { amount: 'Version <literal>' } });
    summaryRoot.innerHTML = '<div data-table-toolbar></div><div class="record-data-table-desktop"></div><div class="record-data-table-cards" data-table-cards></div><div data-table-footer></div>';
    document.getElementById('tables').append(summaryRoot);
    const summaryTable = table('summary-only', [{ name: 'Role or lookup record', amount: 0 }]);
    summaryRoot.querySelector('.record-data-table-desktop').append(summaryTable[0]);
    initDataTable(summaryTable);
    check('Summary supports rows without record destinations', summaryRoot.querySelector('.record-data-card').tagName === 'ARTICLE');
    check('Numeric summary fields have safe contextual labels', summaryRoot.textContent.includes('Version <literal>: 0') && !summaryRoot.querySelector('literal'));
    check('Missing optional summary fields stay absent', !summaryRoot.textContent.includes('undefined') && !summaryRoot.textContent.includes('[object Object]'));
    summaryRoot.remove();
    root.remove();
    await new Promise(resolve => setTimeout(resolve, 10));
    check('Removed responsive component is destroyed', !$.fn.DataTable.isDataTable(responsiveTable[0]));
    if (new URLSearchParams(location.search).has('keep')) {
        document.getElementById('tables').append(root);
        initDataTable(responsiveTable);
        window.responsiveFixtureApi = responsiveTable.DataTable();
        window.responsiveFixtureRoot = root;
        if (new URLSearchParams(location.search).has('preview')) {
            document.body.prepend(root);
            root.style.padding = '1rem';
            [...document.body.children].filter(child => child !== root).forEach(child => child.hidden = true);
            window.scrollTo(0, 0);
        }
    }

    check('Injected scripts never executed', window.tableScriptExecuted === false);
} catch (error) {
    if (!results.some(result => !result.passed)) results.push({ name: error.stack, passed: false });
} finally {
    window.datatableTestResults = results;
    document.getElementById('results').textContent = JSON.stringify(results, null, 2);
    document.title = results.every(result => result.passed) ? 'PASS: DataTables security' : 'FAIL: DataTables security';
}
</script>
</body>
</html>
